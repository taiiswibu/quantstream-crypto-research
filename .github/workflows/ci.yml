name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core and development tools
        run: python -m pip install -e ".[dev]"
      - name: Install CPU PyTorch for causal TCN coverage
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Lint
        run: python -m ruff check quantstream app.py tests scripts
      - name: Test causal features, accounting and snapshot contracts
        run: python -m pytest -q
      - name: Validate notebook schema and Python cells
        run: python scripts/check_notebooks.py
      - name: Compile application
        run: python -m compileall -q quantstream app.py scripts


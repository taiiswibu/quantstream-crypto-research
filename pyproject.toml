[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstream-local"
version = "0.1.0"
description = "Reproducible local crypto research, backtesting and paper trading"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "pyarrow>=17,<27",
  "duckdb>=1.1,<3", "scikit-learn>=1.5,<2", "joblib>=1.4,<2",
  "xgboost-cpu>=2.1,<4; platform_system == 'Linux'",
  "xgboost>=2.1,<4; platform_system != 'Linux'",
  "streamlit>=1.50,<2", "plotly>=5.24,<8", "websockets>=14,<17"
]

[project.optional-dependencies]
dl = ["torch>=2.5,<3"]
research = ["torch>=2.5,<3", "optuna>=4.5,<6"]
finetune = ["torch>=2.5,<3", "chronos-forecasting>=2.3,<3", "peft>=0.18,<1", "accelerate>=1,<2", "datasets>=3,<5"]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "ruff>=0.12,<1"]

[project.scripts]
quantstream = "quantstream.cli:main"

[tool.setuptools.packages.find]
include = ["quantstream*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

